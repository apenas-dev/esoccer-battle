[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esoccer-voice"
version = "0.1.0"
description = "Voice Engine for E-Soccer Battle - STT/TTS with Whisper and Kokoro"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "E-Soccer Team", email = "team@esoccer.local"}
]
keywords = ["voice", "stt", "tts", "whisper", "kokoro", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "faster-whisper>=1.0.0",
    "pydub>=0.25.1",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.1",
    "huggingface-hub>=0.20.0",
    "kokoro>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
esoccer-voice = "esoccer_voice.api.main:runServer"

[tool.setuptools.packages.find]
where = ["."]