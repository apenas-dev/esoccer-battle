name: Build Executables

on:
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub
  push:
    branches:
      - master
      - main
    tags:
      - 'v*' # Roda quando você cria uma tag (ex: v1.0.0)

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Prepare Standalone Python
        working-directory: apps/desktop
        shell: powershell
        run: npm run prepare:python

      - name: Verify Python Dependencies
        working-directory: apps/desktop
        shell: powershell
        run: |
          $pythonExe = "python-standalone\python\python.exe"
          Write-Host "Python executable: $pythonExe"
          & $pythonExe --version

          Write-Host ""
          Write-Host "=== Installed packages ==="
          & $pythonExe -m pip list --format=columns

          Write-Host ""
          Write-Host "=== Import verification ==="
          $deps = @("fastapi", "uvicorn", "numpy", "faster_whisper", "torch", "pydub", "soundfile")
          $failed = @()
          foreach ($dep in $deps) {
            try {
              $output = & $pythonExe -c "import $dep; print('OK:', '$dep', getattr($dep, '__version__', ''))" 2>&1
              Write-Host "[PASS] $dep - $output"
            } catch {
              Write-Host "[FAIL] $dep - $_"
              $failed += $dep
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "FAILED dependencies: $($failed -join ', ')"
            exit 1
          }

          Write-Host ""
          Write-Host "All dependencies verified successfully."

      - name: Download MSVC Redistributable
        working-directory: apps/desktop
        shell: powershell
        run: |
          if (!(Test-Path -Path build)) { New-Item -ItemType Directory -Force -Path build }
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "build\vc_redist.x64.exe"
          Write-Host "Downloaded vc_redist.x64.exe to build directory."

      - name: Build Windows Executable
        working-directory: apps/desktop
        run: npm run build && npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: apps/desktop/release/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install system dependencies for Linux build
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Linux Executables
        working-directory: apps/desktop
        run: npm run build && npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-executables
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.tar.gz
